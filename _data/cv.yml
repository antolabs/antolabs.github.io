name: "Geunhyeong Lee, Ph.D."
email: "leeg@frib.msu.edu"
research:
  title: "Redefining Thermal-Fluid Design through AI"
  description: "My vision is to advance thermal-fluid systems beyond the limits of conventional design. Central to this vision is BiSTO, an AI-driven topology optimization framework that I am developing for thermal-fluid systems. My long-term goal is to connect AI-based design discovery with multiphysics modeling, metal additive manufacturing, and experimental validation for advanced nuclear energy and high-power accelerators."
appointments:
  - title: "Scientist (Staff)"
    institution: "Facility for Rare Isotope Beams (FRIB), Michigan State University"
    department: "High Power Targetry Team"
    location: "East Lansing, MI, US"
    year: "Dec 2023 - Present"
    description:
      - "Developed BiSTO (Binary Surrogate-based Topology Optimization), an AI-driven framework combining surrogate-guided topology search, solver verification, and geometric connectivity constraints for turbulent cooling-channel design."
      - "Optimized the FRIB beam dump using genetic algorithms and reinforcement learning, increasing simulated average power-handling capability by 72% over the existing design."
      - "Developed a CNN\u2013MLP surrogate for rotating beam-dump thermal limits (2.8% mean error against FEM in cross-validation; millisecond-scale inference)."
      - "Led thermal design reviews and provided simulation evidence for device qualification; performed thermal-fluid-electromagnetic analysis and validation."
  - title: "Postdoctoral Researcher"
    institution: "Korea Atomic Energy Research Institute (KAERI)"
    department: "Applied Artificial Intelligence Lab"
    location: "Daejeon, Korea"
    year: "Aug 2021 - Dec 2023"
    description:
      - "Developed DRL optimization with 14.8% higher simulated heat transfer than conventional topology optimization; tested a metal-printed prototype."
      - "Designed flow channels for Samsung OLED susceptors using reinforcement learning."
      - "Designed a single-body, 3D-printable DC electromagnetic pump with 52% lower simulated current demand than a helical pump at matched pressure and flow rate."
      - "Applied AI anomaly detection to the KOMAC accelerator for operational stability."
